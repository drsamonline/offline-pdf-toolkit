# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# This file is intentionally tiny: the whole pipeline lives in the public
# app-builder kit, so a fix there reaches every app at once. It used to be a
# 4.9 kB hand-copied workflow, and the copies drifted - one of them kept
# `if: always()` on the release job, which DELETED the published release before
# recreating it, so a failed build destroyed the release. Do not inline it again.
#
# What it does on every push to main:
#   build the portable EXE and the signed APK -> publish the rolling `app-latest`
#   release -> deploy the demo to Pages. All three come from the same commit, so
#   the live demo and the released build can never disagree.
#
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@bbef0db943e11f1a280ac8a063b79e66b7f6d9db   # was @main
    with:
      app_name: offline-pdf-toolkit
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      id-token: write

  # The app shell was 2,093 KB until 1.9.0 took it to 118 KB by moving the engines
  # out of the HTML. That win is easy to lose by inlining one library again, so it
  # is guarded here rather than remembered.
  #
  # 1.15.0 raised the raw ceiling from 150 KB to 160 KB, deliberately, for the
  # launcher: the empty state became a front door (hero, session list, core tool
  # cards, an all-tools sheet) instead of a paragraph. That is new interface, not
  # an engine drifting back in, and it cost 5 KB gzipped. The gzipped cap is the
  # one that matters for a reader on a phone, so it is checked too — and it is the
  # tighter of the two.
  budget:
    name: Shell size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The shell must stay under 160 KB, and under 52 KB gzipped
        # The shell is docs/play/index.html. This step read app.html, which stopped existing
        # when the app moved under docs/play/ - so it failed on `stat` before measuring
        # anything, red on every push, on a budget nobody had actually breached.
        run: |
          SHELL_PAGE=docs/play/index.html
          if [ ! -f "$SHELL_PAGE" ]; then
            echo "::error::$SHELL_PAGE is missing - the app has moved again; point this check at it"
            exit 1
          fi
          size=$(stat -c%s "$SHELL_PAGE")
          gz=$(gzip -9c "$SHELL_PAGE" | wc -c)
          echo "$SHELL_PAGE is $size bytes ($((size/1024)) KB), $gz gzipped"
          if [ "$size" -gt 163840 ]; then
            echo "::error::$SHELL_PAGE grew past 160 KB ($size bytes) - the engines belong in docs/play/lib/, not inline"
            exit 1
          fi
          if [ "$gz" -gt 53248 ]; then
            echo "::error::$SHELL_PAGE is $gz bytes gzipped, past the 52 KB ceiling"
            exit 1
          fi
          echo "within budget"

  # The CLI is the same two engines with a terminal in front of them: no webview,
  # no signing, no kit — so it is tested and packaged here. The tarball carries
  # cli/ and vendor/ together, because the CLI is useless without the engines it
  # loads, and shipping them apart is how the two versions drift.
  cli:
    name: CLI (pdfkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the independent checker
        run: pip install pymupdf
      - name: Run the CLI suite
        run: python3 cli/test/run.py
      - name: Package
        run: |
          ver=$(cat VERSION)
          mkdir -p dist/pdfkit-$ver
          cp -r cli vendor VERSION LICENSE README.md dist/pdfkit-$ver/
          tar -C dist -czf pdfkit-cli-$ver.tar.gz pdfkit-$ver
          sha256sum pdfkit-cli-$ver.tar.gz > pdfkit-cli-$ver.tar.gz.sha256
          ls -l pdfkit-cli-$ver.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pdfkit-cli
          path: |
            pdfkit-cli-*.tar.gz
            pdfkit-cli-*.tar.gz.sha256
      - name: Attach to the rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload app-latest pdfkit-cli-*.tar.gz pdfkit-cli-*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber \
            || echo "::notice::no app-latest release yet — the artifact is still attached to this run"

  # Every release should say what is in it, byte for byte. The three artefacts are
  # published by the kit's `app` job; this one reads them back, hashes them, and
  # attaches SHA256SUMS so a download can be checked without trusting the network.
  checksums:
    name: Release checksums
    needs: app
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Hash the published artefacts and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p dl
          gh release download app-latest --repo "$GITHUB_REPOSITORY" \
             --pattern 'offline-pdf-toolkit*' --dir dl --clobber
          cd dl
          sha256sum offline-pdf-toolkit* > SHA256SUMS
          cat SHA256SUMS
          gh release upload app-latest SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  # The suites drive the real page in a real browser over the DevTools protocol, so
  # they check what a user gets. They live in tools/test/ and run here on every push
  # and PR — a test that only runs on one machine is a memory, not a check.
  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install the driver
        run: pip install websocket-client pymupdf pillow
      - name: The LockHTML viewer, for the interop check
        run: git clone --depth 1 https://github.com/drsamonline/lockhtml.git "$RUNNER_TEMP/lockhtml"
      - name: Run every suite
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          LOCKHTML: ${{ runner.temp }}/lockhtml
        run: python tools/test/run_all.py
