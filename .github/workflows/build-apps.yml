# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# This file is intentionally tiny: the whole pipeline lives in the public
# app-builder kit, so a fix there reaches every app at once. It used to be a
# 4.9 kB hand-copied workflow, and the copies drifted - one of them kept
# `if: always()` on the release job, which DELETED the published release before
# recreating it, so a failed build destroyed the release. Do not inline it again.
#
# What it does on every push to main:
#   build the portable EXE and the signed APK -> publish the rolling `app-latest`
#   release -> deploy the demo to Pages. All three come from the same commit, so
#   the live demo and the released build can never disagree.
#
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@246da5d54862d2571b0b37feb10499e467f20d7d   # was @main
    with:
      app_name: offline-pdf-toolkit
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      id-token: write

  # The app shell was 2,093 KB until 1.9.0 took it to 118 KB by moving the engines
  # out of the HTML. That win is easy to lose by inlining one library again, so it
  # is guarded here rather than remembered.
  budget:
    name: Shell size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: app.html must stay under 150 KB
        run: |
          size=$(stat -c%s app.html)
          echo "app.html is $size bytes ($((size/1024)) KB)"
          if [ "$size" -gt 153600 ]; then
            echo "::error::app.html grew past 150 KB ($size bytes) - the engines belong in docs/play/lib/, not inline"
            exit 1
          fi
          echo "within budget"
